<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source viewer</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { background: var(--bg); }
  .vbar { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .vbar .title { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .vbody { padding: 8px 0 80px; }
  .pdfwrap { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
  .pdfwrap iframe { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .imgwrap { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
  .imgwrap img { width: 100%; border: 1px solid var(--line); border-radius: 8px; }
  .vtable { padding: 12px 16px; overflow-x: auto; }
  .vtable td { font-size: 13px; }
  @media (max-width: 860px) { .pdfwrap, .imgwrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="vbar">
  <div>
    <div class="kicker">Full document · as received</div>
    <div class="title" id="title"></div>
    <div id="verify" style="margin-top:4px"></div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn small" id="jump">Jump to cited line</button>
    <a class="btn small" id="raw" target="_blank" rel="noopener">Open original file ↗</a>
  </div>
</div>
<div class="vbody" id="body"><div class="empty">loading…</div></div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const params = new URLSearchParams(location.search);
const src = params.get("src") || "", quote = params.get("quote") || "", agent = params.get("agent") || "investigator";
const path = src.replace(/:(\d+)(-\d+)?$/, "");
document.getElementById("title").textContent = src;
document.title = src + " — source viewer";
const page = (src.match(/\.pdf:(\d+)$/) || [])[1];
document.getElementById("raw").href = `/api/raw?agent=${agent}&path=${encodeURIComponent(path)}${page ? "#page=" + page : ""}`;
function hl(text) {
  const t = esc(text); if (!quote) return t; const q = esc(quote); const i = t.indexOf(q);
  return i < 0 ? t : t.slice(0, i) + "<mark>" + q + "</mark>" + t.slice(i + q.length);
}
(async () => {
  const r = await fetch(`/api/source?agent=${agent}&src=${encodeURIComponent(src)}&full=1${quote ? "&quote=" + encodeURIComponent(quote) : ""}`);
  const v = await r.json();
  const body = document.getElementById("body");
  if (v.error) { body.innerHTML = `<div class="empty">${esc(v.error)}</div>`; return; }
  if (v.verification) {
    const s = v.verification.status;
    const cls = s === "verified" ? "verified" : (s === "ocr" || s === "whitespace") ? "ocr" : "bad";
    document.getElementById("verify").innerHTML = `<span class="st ${cls}">${s === "verified" ? "✓ quote found exactly here" : esc(s)}</span> <span class="faint">${esc(v.verification.detail || "")}${v.verification.suggestion ? " → " + esc(v.verification.suggestion) : ""}</span>`;
  }
  if (v.kind === "text") {
    body.innerHTML = v.lines.map((l) => `<div class="src-line ${l.hit ? "hit" : ""}" id="L${l.n}"><span class="n">${l.n}</span><span class="t">${l.hit ? hl(l.text) : esc(l.text)}</span></div>`).join("");
  } else if (v.kind === "pdf") {
    const ocr = v.pages.some((p) => p.ocr);
    body.innerHTML = `<div class="pdfwrap"><iframe src="/api/raw?agent=${agent}&path=${encodeURIComponent(path)}${page ? "#page=" + page : ""}" title="original PDF"></iframe>
      <div>${ocr ? `<div class="ocr-note">Image-only PDF: the text on the right is machine-read (OCR). The original on the left is authoritative.</div>` : `<div class="faint" style="margin-bottom:6px">Extracted text layer</div>`}
      ${v.pages.map((p) => `<div class="card ${p.hit ? "hit" : ""}" style="margin-bottom:10px;${p.hit ? "border-color:var(--amber)" : ""}"><div class="kicker">page ${p.page}</div>${p.text.split("\n").map((ln) => `<div class="plain-line ${quote && ln.includes(quote) ? "hit" : ""}">${hl(ln)}</div>`).join("")}</div>`).join("")}</div></div>`;
  } else if (v.kind === "xlsx") {
    body.innerHTML = `<div class="vtable"><table>${v.rows.map((r) => `<tr id="L${r.row}" style="${r.hit ? "background:var(--amber-bg)" : ""}" class="${r.hit ? "hit" : ""}"><td class="faint mono">${r.row}</td>${r.cells.map((c) => `<td>${hl(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  } else if (v.kind === "image") {
    body.innerHTML = `<div class="imgwrap"><img src="${v.image}" alt="${esc(v.path)}"><div><div class="ocr-note">Machine-read text (OCR). The photo is authoritative — compare before relying on a quote.</div>${v.ocr_text.split("\n").map((ln) => `<div class="plain-line ${quote && ln.includes(quote) ? "hit" : ""}">${hl(ln)}</div>`).join("")}</div></div>`;
  }
  const jump = () => { const h = document.querySelector(".hit"); if (h) h.scrollIntoView({ block: "center" }); };
  document.getElementById("jump").onclick = jump;
  setTimeout(jump, 50);
})();
</script>
</body>
</html>
