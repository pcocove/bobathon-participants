[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bobathon"
version = "0.1.0"
description = "Halcyon Systems case data normalisation pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "icalendar>=5.0",
    "fastmcp>=4.0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bobathon = "bobathon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
